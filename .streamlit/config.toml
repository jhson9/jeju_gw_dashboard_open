# Streamlit 서버 설정 — 공개판 (Streamlit Cloud 호환)
#
# [Cloud 장애 fix 2026-06-11] port = 18501 고정이 Cloud health check
# (localhost:8501/healthz) 실패 → "Oh no" 부팅 실패를 유발했음.
# → port/address 를 명시하지 않으면 Cloud 기본(8501)을 그대로 사용.
#
# 로컬(Windows)에서는 정식 런처(Run_JejuDashboard.bat / launch_dashboard.py)가
# --server.port 18501 을 CLI 로 명시 전달하므로 (CLI > config 우선순위)
# 이 파일에 port 가 없어도 로컬 동작은 동일하다.
#   (참고: Windows 에서 8501 은 예약 포트 범위(8452-8551)라 직접 실행 시
#    PermissionError 가능 — 직접 실행할 일이 있으면 --server.port 지정할 것.)
#
# enableStaticServing: 루트 static/ → /app/static/ 노출 (지도 타일 등).
[server]
headless = true
enableStaticServing = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
