# ==============================================================================
#  파일명: .streamlit/config.toml (repo 루트)
#  목적: Streamlit Cloud 가 src/dashboard/.streamlit/ 대신 루트 .streamlit/ 만
#        읽는 경우 대비. enableStaticServing 명시.
#  (로컬 dev 는 src/dashboard/app.py 옆 .streamlit/ 우선 적용)
# ==============================================================================
[server]
# 2026-06-02 v4 fix: Streamlit Cloud /app/static/... URL 활성화.
# 1.47.1 기본값 false 라 명시 안 하면 32 정사영상 / 34 iframe 무한로딩.
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

[logger]
level = "warning"
