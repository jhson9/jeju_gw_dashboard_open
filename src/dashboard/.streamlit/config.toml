# ==============================================================================
#  src/dashboard/.streamlit/config.toml — 대시보드 진입점(app.py) 옆 안전망 설정
# ------------------------------------------------------------------------------
#  복구 사유 (2026-06-08):
#    2026-06-07 정리(batch2, MOVE_LOG 항목 4)에서 이 파일이 "중복"으로 판단돼
#    아카이브로 이동됨. 그러나 streamlit 은 실행 위치(cwd)의 .streamlit/ 만
#    프로젝트 config 로 읽으므로, 정식 런처(cwd=프로젝트 루트)가 아닌 방식
#    (예: VS Code 의 'Run Python File', src/dashboard 안에서 직접 실행)으로
#    띄우면 루트 config 가 적용되지 않아 enableStaticServing 이 꺼진다.
#    → /app/static/map_tiles/... 타일이 404 → ④·⑪·⑫·⑬ 탭 지도가 안 뜸.
#    이 파일은 app.py 옆에 있어 어떤 실행 방식이든 static 서빙을 보장한다.
#
#  ⚠️ 포트: 옛 파일은 8501(예약범위 충돌) 이었으나 18501(루트 config 와 동일)
#     로 정정. 단, 정식 런처는 항상 --server.port 를 명시 전달하므로 이 값은
#     런처 경유 시 무시되고, 직접 실행 시에만 기본값으로 쓰인다.
# ==============================================================================
[server]
port = 18501
headless = true
address = "127.0.0.1"
runOnSave = true
# 핵심: 부모 config 상속에 의존하지 말고 여기서도 명시 — cwd 무관 보장.
# 루트 static/ (실제 src/dashboard/static/) 을 /app/static/ 으로 노출.
enableStaticServing = true

[logger]
level = "warning"

[browser]
gatherUsageStats = false
