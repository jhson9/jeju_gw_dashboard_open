# ==============================================================================
#  src/dashboard/.streamlit/config.toml — app.py 옆 안전망 설정 (공개판)
# ------------------------------------------------------------------------------
#  [Cloud 장애 fix 2026-06-11 V2.0.2]
#  Streamlit 은 "실행 스크립트 옆"의 .streamlit/config.toml 을 읽는다
#  (샌드박스 재현으로 확인). 기존 port=18501 + address=127.0.0.1 이
#  Cloud health check(localhost:8501) 실패 → "Oh no" 부팅 실패의 원인.
#  → port/address 제거. Cloud 는 기본 8501, 로컬 런처는 --server.port
#    CLI 명시 전달(CLI > config)이라 양쪽 모두 정상.
# ==============================================================================
[server]
headless = true
runOnSave = true
# 루트 static/ (실제 src/dashboard/static/) 을 /app/static/ 으로 노출.
enableStaticServing = true

[logger]
level = "warning"

[browser]
gatherUsageStats = false
