<!DOCTYPE html>
<!--
  드론 3D 뷰어 (CesiumJS 1.141) — Build 2.2, 2026-05-25

  설계 핵심:
   - pdf_server :8766 의 drone_viewer 소스로 서빙 → location.origin = 127.0.0.1:8766
   - Cesium.js / Workers / Assets 도 같은 origin (cesium_lib)
   - 3D Tiles 도 같은 origin (drone)
   → Web Worker same-origin 정책 충족 → Draco 디코딩 worker 정상 작동

  단일 viewer (tab33) — dual viewer (tab35 diff_viewer_3d.html) 와 달리
  LOD 좌·우 일치 문제 없음. 따라서 LOD 5종 OFF 옵션 불필요.
  단, GPU 안정성을 위해 다음 4종은 dual viewer 와 동일 적용 (Build 2.2):
   · webglcontextlost preventDefault + restored 시 location.reload()
   · scene.renderError 자가 복원 + 3회 카운터
   · contextOptions.webgl.powerPreference = 'high-performance'
   · scene.requestRenderMode = true + maximumRenderTimeChange = Infinity

  미션별 파라미터: URL hash (#) 로 전달 — 서버에 전송 안 되므로 pdf_server 의
  DENY 토큰(`:`, `..`) / strict unquote 와 충돌 없음.

  관련 메모리:
    [[project-drone-purpose]] 시설물 관리·시계열 변화 감지
    [[project-drone-dual-viewer-sync]] dual viewer 패턴 (tab35 만 적용)
    [[feedback-cesium-show-not-assign]] scene.xxx.show=false 만 사용
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>드론 3D 뷰어</title>
  <!-- ❶ Cesium.js 보다 반드시 먼저: CESIUM_BASE_URL = 같은 origin 의 cesium_lib.
       이 페이지가 8766 의 진짜 페이지이므로 location.origin 이 정상값. -->
  <script>
    window.CESIUM_BASE_URL = location.origin + "/pdfs/cesium_lib/";
  </script>
  <!-- ❷ 같은 origin 에서 Cesium 로드 → worker same-origin → blob 워크어라운드 자체가 불필요.
       ?v=1141 캐시 버스트 (2026-05-25 Cesium 1.110→1.141 업그레이드). 롤백 시 ?v=110 으로. -->
  <script src="/pdfs/cesium_lib/Cesium.js?v=1141"></script>
  <link  href="/pdfs/cesium_lib/Widgets/widgets.css?v=1141" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      overflow: hidden; background: #0a0a0a;
    }
    #ovl {
      position: absolute; top: 8px; left: 8px; z-index: 9;
      color: #fff; font: 12px/1.5 monospace;
      background: rgba(0,0,0,.72);
      padding: 6px 12px; border-radius: 4px;
      max-width: 70%; white-space: pre-line;
      pointer-events: none;
    }
    #ovl.ok  { background: rgba(30,90,30,.6); }
    #ovl.err { background: rgba(160,40,40,.92); }
    #home {
      position: absolute; top: 8px; right: 8px; z-index: 9;
      background: rgba(0,0,0,.7); color: #fff;
      border: 1px solid #555;
      padding: 6px 12px; border-radius: 4px;
      cursor: pointer; font-family: sans-serif;
    }
    /* 측정 도구바 — cesiumContainer 안에 배치(전체화면에서도 표시). */
    #measToolbar {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; pointer-events: auto;
      background: rgba(255,255,255,.96); border: 1px solid #ccc; border-radius: 9px;
      padding: 7px 13px; box-shadow: 0 2px 8px rgba(0,0,0,.25);
      font: 15px sans-serif; display: flex; gap: 8px; align-items: center;
    }
    #measToolbar .lbl { font-weight: 600; font-size: 15px; color: #333; margin-right: 3px; }
    .measBtn {
      border: 1px solid #ccc; background: #f7f7f7; border-radius: 7px;
      padding: 6px 13px; cursor: pointer; color: #222; font-size: 15px;
    }
    .measBtn:hover { background: #eee; }
    .measBtn.active { background: #ff4b4b; color: #fff; border-color: #ff4b4b; }
    #measHint {
      position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
      z-index: 1000; pointer-events: none;
      background: rgba(0,0,0,.62); color: #fff; font: 14px sans-serif;
      padding: 4px 12px; border-radius: 5px; white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="ovl">초기화 중…</div>
<button id="home">🏠 모델로</button>
<script>
// hash 변경(미션 전환) 시 자동 reload — iframe src 의 hash 만 바뀌면 브라우저가
// same-document navigation 으로 처리해 viewer 재초기화 안 됨. 이걸로 강제 reload.
window.addEventListener('hashchange', () => location.reload());

(async function () {
  const ovl = document.getElementById('ovl');
  const setOvl = (m, c) => { ovl.className = c || ''; ovl.textContent = m; };

  // ── URL 해시 파라미터 (?쿼리 아님 → 서버 미전송 → DENY 토큰 우회) ──
  const p = new URLSearchParams(location.hash.slice(1));
  const tilesetUrl = p.get('tileset');
  const lat = parseFloat(p.get('lat'));
  const lon = parseFloat(p.get('lon'));
  const sse = parseFloat(p.get('sse') || '8');   // DJI Terra 권장 4~8

  if (typeof Cesium === 'undefined') {
    setOvl('Cesium 로드 실패 (MIME/경로 확인)', 'err');
    return;
  }
  if (!tilesetUrl) {
    setOvl('tileset 파라미터 없음', 'err');
    return;
  }

  try {
    Cesium.Ion.defaultAccessToken = undefined;   // 오프라인: Ion 비활성

    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayer: false,            // 인터넷 imagery 안 씀 (1.107+ 권장)
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,           // 우주로 가는 default home 비활성 — 커스텀 버튼 사용
      sceneModePicker: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      infoBox: false,
      selectionIndicator: false,
      fullscreenButton: true,
      // GPU 성능 최우선 (Build 2.2, dual viewer 와 동일 옵션).
      contextOptions: {
        webgl: {
          preserveDrawingBuffer: false,
          powerPreference: 'high-performance',
        },
      },
    });

    // ──── 명시 렌더 모드 — GPU 부담 ↓ + 카메라 정지 시 frame 0 ────
    // 미션 전환 시 GPU 압박을 줄여 webglcontextlost 발생 빈도 ↓.
    viewer.scene.requestRenderMode = true;
    viewer.scene.maximumRenderTimeChange = Infinity;

    // ──── WebGL context lost 방어 (Build 2.2 추가) ────
    // diff_viewer_3d.html 의 검증된 패턴 이식. Cesium 1.141 의 GPU 메모리
    // 해제 지연 + Chrome WebGL context 16개 한도로 인해 미션 다회 전환 시
    // canvas 검은 화면 영구 lost 가능 → preventDefault() + reload 로 복구.
    const canvas = viewer.scene.canvas;
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      console.warn('[viewer3d] webglcontextlost');
      setOvl('⚠ WebGL context lost — 페이지 복원 중', 'err');
    }, false);
    canvas.addEventListener('webglcontextrestored', () => {
      console.log('[viewer3d] webglcontextrestored — reloading');
      setTimeout(() => location.reload(), 100);
    }, false);

    // ──── renderError 자가 복원 + 3회 카운터 (무한 루프 차단) ────
    let _errCount = 0;
    viewer.scene.renderError.addEventListener((scene, err) => {
      _errCount++;
      console.warn('[viewer3d] renderError #' + _errCount, err);
      if (_errCount > 3) {
        setOvl('⚠ render error 3회 — 새로고침 권장', 'err');
        return;
      }
      requestAnimationFrame(() => {
        viewer.useDefaultRenderLoop = true;
        viewer.scene.requestRender();
      });
    });

    // imagery 없는 globe — 까만 표면 + 하늘/태양/달 오브젝트 비활성.
    // ⚠ scene.skyAtmosphere = false (객체 덮어쓰기) 금지 — Cesium 1.141 의
    // setDynamicLighting TypeError 회피. .show = false 만 토글.
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#2a2a28');
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0a0a0a');
    if (viewer.scene.skyAtmosphere) viewer.scene.skyAtmosphere.show = false;
    if (viewer.scene.skyBox)        viewer.scene.skyBox.show = false;
    if (viewer.scene.sun)           viewer.scene.sun.show = false;
    if (viewer.scene.moon)          viewer.scene.moon.show = false;

    setOvl('3D Tiles 로드 중…');

    // Cesium 1.107+ 표준 API: 비동기 fromUrl(url, options).
    // 옛 readyPromise 패턴은 1.141 에서 작동 안 함 (검은 화면).
    const tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl, {
      maximumScreenSpaceError: sse,
    });
    viewer.scene.primitives.add(tileset);
    await viewer.zoomTo(tileset);

    // 첫 타일 렌더 후 완료 표시 (성공 시 1회만)
    let done = false;
    viewer.scene.postRender.addEventListener(() => {
      const s = tileset.statistics;
      if (!done && s && s.numberOfTilesWithContentReady > 0) {
        done = true;
        setOvl('✅ 로드 완료 · tiles=' + s.numberOfTilesWithContentReady +
               '/' + s.numberOfTilesTotal, 'ok');
        // 3초 후 오버레이 사라짐 (시각 방해 최소화)
        setTimeout(() => { ovl.style.opacity = '0.3'; }, 3000);
      }
    });

    document.getElementById('home').onclick = () => viewer.zoomTo(tileset);

    // ====================================================================
    //  측정 도구 (DJI Terra 식) — 좌표(Coordinate) + 거리(Distance)
    //  2026-05-26 tab33 이식. 2D(tab32) 와 동일 UX: 좌표=X/Y/Z, 거리=직선거리,
    //  시작점 삼각형, 해제=초기화.
    //  설계 핵심 (오프라인·지형없음·requestRenderMode):
    //   · 표면 점은 scene.pickPosition (3D Tiles 깊이) 로만 — globe.pick/
    //     pickEllipsoid 는 평평한 타원체라 표고 무의미.
    //   · requestRenderMode=true → 엔티티 add/remove 마다 scene.requestRender()
    //     강제(누락 시 안 보임). pickPositionSupported 가드 + 빈 공간 클릭 무시.
    //   · Z 는 타원체고(ellipsoidal) — 2D DSM 표고(정사고)와 데이텀이 달라 라벨 명기.
    //     단 상대 거리·직선거리는 데이텀 오프셋 상쇄로 정확.
    //   · 모드 전환/해제 시 핸들러 destroy(중복 방지) + 측정 엔티티만 제거(tileset 보존).
    // ====================================================================
    const scene = viewer.scene;
    // 더블클릭 엔티티 추적(카메라 점프) 비활성 — 측정 클릭 간섭 방지.
    viewer.screenSpaceEventHandler.removeInputAction(
      Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);

    const COL_RED = Cesium.Color.fromCssColorString('#e24b4a');
    // 거리/면적 외곽선 — 노랑 + 검정 외곽(시작점 삼각형과 동일 톤). 정사영상·메시 위에서
    // 빨간선이 잘 안 보이는 문제 해소(시인성↑).
    const COL_YELLOW = Cesium.Color.fromCssColorString('#FFD400');
    const _lineMaterial = new Cesium.PolylineOutlineMaterialProperty({
      color: COL_YELLOW,
      outlineColor: Cesium.Color.fromCssColorString('#111111'),
      outlineWidth: 2,
    });
    const hintEl = (() => {
      const h = document.createElement('div');
      h.id = 'measHint'; h.style.display = 'none';
      document.getElementById('cesiumContainer').appendChild(h);
      return h;
    })();
    const setHint = (t) => {
      if (!t) { hintEl.style.display = 'none'; return; }
      hintEl.textContent = t; hintEl.style.display = '';
    };

    function _startTriURI() {
      // 노랑 내부 + 검정 외곽 삼각형(아래 꼭짓점=지점). 오프라인 안전(dataURI).
      const c = document.createElement('canvas'); c.width = c.height = 28;
      const g = c.getContext('2d');
      g.beginPath(); g.moveTo(14, 26); g.lineTo(3, 5); g.lineTo(25, 5); g.closePath();
      g.fillStyle = '#ffd400'; g.fill();
      g.lineWidth = 2.5; g.strokeStyle = '#111'; g.lineJoin = 'round'; g.stroke();
      return c.toDataURL();
    }
    const START_URI = _startTriURI();

    const _labelStyle = {
      font: '15px sans-serif', fillColor: Cesium.Color.WHITE,
      showBackground: true, backgroundColor: new Cesium.Color(0, 0, 0, 0.72),
      backgroundPadding: new Cesium.Cartesian2(7, 5),
      pixelOffset: new Cesium.Cartesian2(0, -18),
      disableDepthTestDistance: Number.POSITIVE_INFINITY,
      horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
      verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
    };
    const _addPoint = (pos, isStart) => isStart
      ? viewer.entities.add({ position: pos, billboard: {
          image: START_URI, verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          disableDepthTestDistance: Number.POSITIVE_INFINITY } })
      : viewer.entities.add({ position: pos, point: {
          pixelSize: 9, color: COL_RED, outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2, disableDepthTestDistance: Number.POSITIVE_INFINITY } });
    const _addLabel = (pos, text) =>
      viewer.entities.add({ position: pos, label: { ..._labelStyle, text } });
    const _toLLH = (cart) => {
      const c = Cesium.Cartographic.fromCartesian(cart);
      if (!Cesium.defined(c)) return null;   // 퇴화 입력 방어
      return { lon: Cesium.Math.toDegrees(c.longitude),
               lat: Cesium.Math.toDegrees(c.latitude), h: c.height };
    };
    const _cumulative = (pts) => {
      let d = 0;
      for (let i = 1; i < pts.length; i++) d += Cesium.Cartesian3.distance(pts[i - 1], pts[i]);
      return d;
    };
    function _pick(winPos) {
      if (!scene.pickPositionSupported) {
        setOvl('이 환경에선 3D 측정 미지원 (WebGL2 depth 필요)', 'err');
        return undefined;
      }
      // 견고한 히트 판정: '=== tileset' 등치 비교는 Cesium 이 메시를 내부 래핑하면
      // 정당한 표면 클릭을 놓칠 수 있어 회피. 대신 ① 우리 측정 마커(엔티티)를 클릭한
      // 경우만 제외하고 ② 깊이버퍼(pickPosition)에 값이 있으면(=표면) 채택.
      // 빈 하늘은 깊이가 없어 pickPosition 이 undefined → 자동 무시.
      const picked = scene.pick(winPos);
      if (Cesium.defined(picked) && Cesium.defined(picked.id) &&
          (coordEnts.indexOf(picked.id) !== -1 || distEnts.indexOf(picked.id) !== -1 ||
           areaEnts.indexOf(picked.id) !== -1)) {
        return undefined;                                  // 측정 마커(점/선/라벨) 자체 클릭 무시
      }
      const cart = scene.pickPosition(winPos);
      return Cesium.defined(cart) ? cart : undefined;
    }

    let measMode = null, measHandler = null;
    let coordEnts = [], distPoints = [], distEnts = [];
    let areaPoints = [], areaEnts = [];
    const _remove = (arr) => { arr.forEach((e) => viewer.entities.remove(e)); arr.length = 0; };
    function _clearAll() {
      _remove(coordEnts); _remove(distEnts); _remove(areaEnts);
      distPoints = []; areaPoints = [];
      scene.requestRender();
    }
    // 투영 면적(m²) — 클릭점 lon/lat 을 첫 점 기준 local meter 로 투영 후 shoelace.
    // 드론 규모(수십~수백 m)에서 사실상 정확. 2D 의 측지 투영면적과 일관(수평 투영).
    function _projArea(carts) {
      if (carts.length < 3) return 0;
      const toDeg = Cesium.Math.toDegrees;
      const cs = carts.map((c) => Cesium.Cartographic.fromCartesian(c));
      const lon0 = toDeg(cs[0].longitude), lat0 = toDeg(cs[0].latitude);
      const mLat = 110540, mLon = 111320 * Math.cos(cs[0].latitude);
      const xy = cs.map((c) => [(toDeg(c.longitude) - lon0) * mLon,
                                (toDeg(c.latitude) - lat0) * mLat]);
      let a = 0;
      for (let i = 0; i < xy.length; i++) {
        const j = (i + 1) % xy.length;
        a += xy[i][0] * xy[j][1] - xy[j][0] * xy[i][1];
      }
      return Math.abs(a) / 2;
    }
    function _redrawCoord(cart) {
      const llh = _toLLH(cart);
      if (!llh) return;
      _remove(coordEnts);
      coordEnts.push(_addPoint(cart, false));
      coordEnts.push(_addLabel(cart,
        `X ${llh.lon.toFixed(6)}\nY ${llh.lat.toFixed(6)}\nZ ${llh.h.toFixed(2)} m`));
      scene.requestRender();
    }
    function _redrawDist() {
      _remove(distEnts);
      distPoints.forEach((pos, i) => distEnts.push(_addPoint(pos, i === 0)));
      if (distPoints.length >= 2) {
        distEnts.push(viewer.entities.add({ polyline: {
          positions: distPoints.slice(), width: 5, material: _lineMaterial } }));
        distEnts.push(_addLabel(distPoints[distPoints.length - 1],
          _cumulative(distPoints).toFixed(2) + ' m'));
      }
      scene.requestRender();
    }
    function _redrawArea() {
      _remove(areaEnts);
      areaPoints.forEach((pos) => areaEnts.push(_addPoint(pos, false)));
      if (areaPoints.length >= 2) {
        const outline = areaPoints.slice();
        if (areaPoints.length >= 3) outline.push(areaPoints[0]);   // 폴리곤 닫기
        areaEnts.push(viewer.entities.add({ polyline: {
          positions: outline, width: 5, material: _lineMaterial } }));
      }
      if (areaPoints.length >= 3) {
        // ★ 채워진 폴리곤은 비스듬한 시점에서 클릭 광선을 가로채(시차) 다음 점의
        //   좌표가 틀어지므로 그리지 않는다. 닫힌 외곽선 + 중심 면적 라벨로 표시하고,
        //   클릭은 메시 표면으로 통과시킨다(2D 는 탑다운이라 채움 유지).
        const ctr = new Cesium.Cartesian3();
        areaPoints.forEach((p) => Cesium.Cartesian3.add(ctr, p, ctr));
        Cesium.Cartesian3.divideByScalar(ctr, areaPoints.length, ctr);
        areaEnts.push(_addLabel(ctr, _projArea(areaPoints).toFixed(2) + ' m²'));
      }
      scene.requestRender();
    }
    function _onClick(winPos) {
      const cart = _pick(winPos);
      if (!cart) return;
      if (measMode === 'coord') _redrawCoord(cart);
      else if (measMode === 'dist') { distPoints.push(cart); _redrawDist(); }
      else if (measMode === 'area') { areaPoints.push(cart); _redrawArea(); }
    }
    function _onRight() {                 // 거리/면적: 마지막 점 취소
      if (measMode === 'dist' && distPoints.length) { distPoints.pop(); _redrawDist(); }
      else if (measMode === 'area' && areaPoints.length) { areaPoints.pop(); _redrawArea(); }
    }
    function _destroyHandler() {
      if (measHandler && !measHandler.isDestroyed()) measHandler.destroy();
      measHandler = null;
    }
    function _setMode(mode) {
      _destroyHandler();
      _clearAll();                         // 모드 전환 시 진행 중 측정 초기화 (2D 와 동일)
      measMode = mode;
      ['measCoord', 'measDist', 'measArea'].forEach((id) =>
        document.getElementById(id).classList.remove('active'));
      if (mode === 'coord') {
        document.getElementById('measCoord').classList.add('active');
        setHint('🎯 표면을 클릭하면 X/Y/Z(경도·위도·표고)가 표시됩니다');
      } else if (mode === 'dist') {
        document.getElementById('measDist').classList.add('active');
        setHint('📏 좌클릭: 점 추가 · 우클릭: 마지막 점 취소 · 해제: 초기화');
      } else if (mode === 'area') {
        document.getElementById('measArea').classList.add('active');
        setHint('▱ 좌클릭: 점 추가(3점↑) · 우클릭: 마지막 점 취소 · 해제: 초기화');
      } else {
        setHint(null);
      }
      if (!mode) return;
      measHandler = new Cesium.ScreenSpaceEventHandler(scene.canvas);
      measHandler.setInputAction((e) => _onClick(e.position),
        Cesium.ScreenSpaceEventType.LEFT_CLICK);
      measHandler.setInputAction(() => _onRight(),
        Cesium.ScreenSpaceEventType.RIGHT_CLICK);
    }

    // 툴바 DOM — cesiumContainer 안에 두어 전체화면에서도 보이게.
    const _tb = document.createElement('div');
    _tb.id = 'measToolbar';
    _tb.innerHTML =
      '<span class="lbl">측정</span>' +
      '<button id="measCoord" class="measBtn">🎯 좌표</button>' +
      '<button id="measDist" class="measBtn">📏 거리</button>' +
      '<button id="measArea" class="measBtn">▱ 면적</button>' +
      '<button id="measClear" class="measBtn">✖ 해제</button>';
    document.getElementById('cesiumContainer').appendChild(_tb);
    document.getElementById('measCoord').onclick =
      () => _setMode(measMode === 'coord' ? null : 'coord');
    document.getElementById('measDist').onclick =
      () => _setMode(measMode === 'dist' ? null : 'dist');
    document.getElementById('measArea').onclick =
      () => _setMode(measMode === 'area' ? null : 'area');
    document.getElementById('measClear').onclick = () => _setMode(null);

    // iframe 컨테이너가 0px 로 mount 되는 경우 대비 — ResizeObserver 로 자동 보정
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => {
        viewer.resize();
        viewer.scene.requestRender();
      });
      ro.observe(document.getElementById('cesiumContainer'));
    }
    window.addEventListener('resize', () => {
      viewer.resize();
      viewer.scene.requestRender();
    });

  } catch (e) {
    setOvl('Tileset 로드 실패: ' + (e && e.message ? e.message : e), 'err');
    console.error(e);
  }
})();
</script>
</body>
</html>
