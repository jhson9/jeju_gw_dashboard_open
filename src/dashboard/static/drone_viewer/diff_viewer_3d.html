<!--
================================================================================
 드론 3D 시계열 비교 뷰어 (CesiumJS 1.141) — Build 3.0, 2026-05-25 종합 개편
================================================================================

 설계: 좌·우 분할 두 Cesium Viewer, master-slave 단방향 sync.
   · 우측 = master (사용자 조작 + adaptive SSE trigger)
   · 좌측 = slave  (마우스 입력 차단, master 카메라 자동 동기화)
   · 같은 origin (pdf_server :8766) → Cesium Worker 정상 작동

 파라미터:
   query: l=<left_mission_id>&r=<right_mission_id>&_v=<cache_buster>
   hash:  left_tileset, left_lat, left_lon, left_alt, left_label,
          right_tileset, right_lat, right_lon, right_alt, right_label, sse

--------------------------------------------------------------------------------
 변경 이력 (2026-05-25 사용자 검증 + 에이전트 다회 진단)
--------------------------------------------------------------------------------

 [Build 2.0] 초기 양방향 동기화 → 5개 증상 발견:
   1) 깜빡거림: 마우스 없이도 좌·우 미세 떨림
   2) 좌측 통째 검은 화면 (간헐적)
   3) 라벨(간판) 보였다 안 보였다
   4) 좌·우 LOD 불일치 (서림 수원지 나무 2 vs 3)
   5) 처음엔 같다가 시간 지나면 divergent

 [원인 분석 — 다회 에이전트 합의]

   A) 양방향 sync 의 무한 ping-pong:
        camera.changed → setView → camera.changed 무한 echo.
        부동소수점 round-off 도 trigger 되어 정지 시에도 미세 흔들림.
        → percentageChanged + threshold + rAF guard 3중망으로 1차 완화,
          최종적으로 master-slave 단방향으로 원천 차단 (Build 3.0).

   B) Cesium 기본 60fps continuous render + tile streaming:
        tile LOD 갱신이 매 frame 카메라 미세 변동 trigger.
        → scene.requestRenderMode = true + maximumRenderTimeChange = Infinity.
          정지 시 frame 생성 0 → GPU 휴식 + drift 차단.

   C) WebGL context lost (두 viewer 가 GPU 메모리 공유):
        Chrome 의 active WebGL context 한도(16) + 메모리 압박 시 lost.
        Cesium 은 내부 자동 복구 없음.
        → preventDefault() 로 영구 lost 차단,
          webglcontextrestored 시 location.reload() (전체 viewer 재생성).

   D) iframe reload (Streamlit fragment rerun 시):
        st.components.v1.iframe 은 fragment rerun 시 무조건 unmount→remount.
        하지만 사용자가 마우스 안 만지면 rerun 자체가 없으니 주범 아님.
        → 진단용 PAGE LOAD timestamp 표시로 검증 (현재는 제거).

   E) 좌·우 LOD divergence — 핵심 5종 원인:
        E1) Camera.setView() 가 dst 에 moveStart/moveEnd 이벤트 미발생.
            → src 의 adaptive SSE 가 dst 에 적용 안 됨 → 영구 LOD 락.
            → master-slave 로 한쪽만 movement 발생 + 양쪽 SSE 동시 변경.
        E2) dynamicScreenSpaceError 가 viewer 별 독립 bell-curve 계산.
            → 부동소수점 카메라 차이로 같은 위치에서도 다른 SSE.
            → OFF (dynamicScreenSpaceError = false).
        E3) skipLevelOfDetail = true (기본) 의 중간 LOD 건너뛰기.
            → 두 viewer 가 다른 중간 LOD 선택 → 영구 divergence.
            → OFF (skipLevelOfDetail = false).
        E4) foveatedScreenSpaceError 중앙/가장자리 차등 SSE.
            → OFF.
        E5) progressiveResolutionHeightFraction prepass timing 차이.
            → 0 (OFF).
        + cullRequestsWhileMoving = false (movement 중 request 폐기 차단)
        + preloadWhenHidden = true (hidden frame 에서도 streaming)

   F) Framebuffer-incomplete 경고 (canvas 0-size frame):
        Streamlit iframe height=0 (#7376) + ResizeObserver 콜백 전 render
        시도 → GL_INVALID_FRAMEBUFFER_OPERATION 콘솔 경고.
        → requestRenderMode=true + maxRenderTimeChange=Infinity 조합으로
          0-size frame 자체가 거의 안 발생 → 경고 자연 소거.
        → ResizeObserver 가드만 유지 (0-size 시 viewer.resize() skip).

   G) preRender 0-size 가드의 dead-lock (Build 2.x 의 함정):
        useDefaultRenderLoop = false 토글 → Cesium 자체 renderError 시 같은
        세팅과 timing 충돌 → 다음 frame 에 true 로 되돌릴 주체 사라짐
        → 좌측 검은 화면 영구 락 (간헐적 증상의 정체).
        → preRender 가드 완전 제거, scene.renderError 이벤트에서
          자동 복원 + 3회 카운터로 무한 루프 차단.

--------------------------------------------------------------------------------
 현재 적용된 안전망 (Build 3.0)
--------------------------------------------------------------------------------

 카메라 sync — 단방향 master(우) → slave(좌):
   · slave.scene.screenSpaceCameraController.enableInputs = false
     (+ enableRotate/Translate/Zoom/Tilt/Look 모두 false)
   · master.camera.changed → slave.camera.setView + wakeBoth()
   · percentageChanged = 1e-4 (LOD 일치를 위해 매우 민감)

 LOD 동기화 — 5종 OFF + adaptive SSE 양쪽 동시:
   · dynamicScreenSpaceError = false
   · skipLevelOfDetail = false
   · foveatedScreenSpaceError = false
   · progressiveResolutionHeightFraction = 0
   · cullRequestsWhileMoving = false
   · preloadWhenHidden = true
   · master.moveStart → 양쪽 tileset.maximumScreenSpaceError = 32
   · master.moveEnd + 800ms → 양쪽 tileset.maximumScreenSpaceError = 4
   · tileset.tileLoad → wakeBoth() (streaming timing 보정)

 Render 최적화:
   · scene.requestRenderMode = true
   · scene.maximumRenderTimeChange = Infinity
   · contextOptions.webgl.powerPreference = 'high-performance'
   · contextOptions.webgl.preserveDrawingBuffer = false

 메모리 cap (데스크탑 GPU 4GB+ 전제):
   · cacheBytes = 512 MB / viewer (총 ~1 GB)
   · maximumCacheOverflowBytes = 128 MB

 WebGL 복구:
   · webglcontextlost: preventDefault() + 상태 표시
   · webglcontextrestored: location.reload() (Cesium 내부 복원 없음)
   · scene.renderError: 다음 frame 에 useDefaultRenderLoop = true 복원
     (3회 초과 시 새로고침 권유)

 UI 안내:
   · 좌측 panel: "🔒 자동 동기화 · 조작은 우측에서"
   · 우측 panel: "🎮 조작 영역 (회전·줌·팬)"
   · 라벨에 will-change: transform — compositor layer 분리로 tearing 차단

--------------------------------------------------------------------------------
 향후 데이터 확보 시 검증 필요 (현재 시뮬레이션 모드)
--------------------------------------------------------------------------------
   · 같은 site_id 의 다른 시점 b3dm 확보 시 좌·우 정확히 다른 데이터 표시
   · 두 tileset 의 RTK 보정 일치 확인 (좌표계 동일 필요)
   · DoD/M3C2 자동 차이 분석 → bbox 산출 → viewer.flyTo() 자동 이동
   · 변화 영역 colormap overlay (반투명) — 좌·우 사이 또는 양쪽 위
   · "다음 변화 지점" 버튼 — 순차 탐색 워크플로우

   [[feedback-cesium-show-not-assign]] scene.xxx.show=false 만 사용
   [[project-drone-dual-viewer-sync]] master-slave + LOD 5종 OFF 패턴

<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>드론 3D 시계열 비교</title>
  <script>
    // Cesium.js 보다 반드시 먼저 — CESIUM_BASE_URL = same-origin cesium_lib
    window.CESIUM_BASE_URL = location.origin + "/pdfs/cesium_lib/";
  </script>
  <script src="/pdfs/cesium_lib/Cesium.js?v=1141"></script>
  <link  href="/pdfs/cesium_lib/Widgets/widgets.css?v=1141" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
    }
    #split { display: flex; height: 100%; width: 100%; }
    .panel { flex: 1; position: relative; min-width: 0; background: #0a0a0a; }
    .panel + .panel { border-left: 2px solid #2a2a28; }
    .cv { width: 100%; height: 100%; }
    .label {
      position: absolute; top: 8px; left: 8px; z-index: 9;
      color: #fff; font: 600 13px/1.4 sans-serif;
      background: rgba(0,0,0,0.72);
      padding: 4px 12px; border-radius: 4px;
      max-width: 80%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      pointer-events: none;
      /* will-change + translateZ — compositor 별도 layer 로 분리.
         Cesium 매 frame re-paint 가 라벨에 tearing 일으키는 현상 차단. */
      will-change: transform;
      transform: translateZ(0);
    }
    .label.left  { border-left: 4px solid #4a90e2; }
    .label.right { border-left: 4px solid #e6a23c; }
    .home {
      position: absolute; top: 8px; right: 8px; z-index: 9;
      background: rgba(0,0,0,0.7); color: #fff;
      border: 1px solid #555;
      padding: 4px 10px; border-radius: 4px;
      cursor: pointer; font: 12px sans-serif;
    }
    #err {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 9999;
      background: rgba(160,40,40,0.92); color: #fff;
      padding: 20px 30px; border-radius: 6px;
      font-size: 13px; display: none; max-width: 60%;
    }
    .status {
      position: absolute; bottom: 8px; left: 8px; z-index: 9;
      color: #fff; font: 11px/1.4 monospace;
      background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 3px;
      pointer-events: none;
    }
    /* master/slave 역할 안내 — 사용자 결정 (2026-05-25):
       우측 = 마스터 (조작), 좌측 = slave (자동 동기화).
       LOD desync 의 근본 원인 (setView 가 moveStart/moveEnd 미발생) 차단. */
    .role {
      position: absolute; top: 32px; left: 8px; z-index: 9;
      color: #fff; font: 600 11px/1.4 sans-serif;
      background: rgba(0,0,0,0.78); padding: 2px 8px; border-radius: 3px;
      pointer-events: none;
      will-change: transform; transform: translateZ(0);
    }
    .role.slave  { color: #b8d4f0; }
    .role.master { color: #ffd57a; }
  </style>
</head>
<body>
<div id="split">
  <div class="panel">
    <div class="label left" id="lbl-left">◀ 좌측</div>
    <div class="role slave">🔒 자동 동기화 · 조작은 우측에서</div>
    <button class="home" id="home-left">🏠 모델로</button>
    <div class="cv" id="cv-left"></div>
    <div class="status" id="status-left">초기화…</div>
  </div>
  <div class="panel">
    <div class="label right" id="lbl-right">우측 ▶</div>
    <div class="role master">🎮 조작 영역 (회전·줌·팬)</div>
    <button class="home" id="home-right">🏠 모델로</button>
    <div class="cv" id="cv-right"></div>
    <div class="status" id="status-right">초기화…</div>
  </div>
</div>
<div id="err"></div>
<script>
// hashchange → reload 리스너 제거 (2026-05-25).
// Streamlit iframe 은 URL 차이로 자체 재생성되므로 불필요.

(async function () {
  const errEl = document.getElementById('err');
  const showErr = (m) => { errEl.textContent = '⚠ ' + m; errEl.style.display = 'block'; };
  const setStatus = (side, m) => { document.getElementById('status-' + side).textContent = m; };

  if (typeof Cesium === 'undefined') {
    showErr('Cesium 라이브러리 로드 실패');
    return;
  }

  try {
    const p = new URLSearchParams(location.hash.slice(1));
    const leftTileset  = p.get('left_tileset');
    const leftLat   = parseFloat(p.get('left_lat'));
    const leftLon   = parseFloat(p.get('left_lon'));
    const leftAlt   = parseFloat(p.get('left_alt') || '200');
    const leftLabel = p.get('left_label') || '좌측';
    const rightTileset  = p.get('right_tileset');
    const rightLat  = parseFloat(p.get('right_lat'));
    const rightLon  = parseFloat(p.get('right_lon'));
    const rightAlt  = parseFloat(p.get('right_alt') || '200');
    const rightLabel = p.get('right_label') || '우측';
    const sse = parseFloat(p.get('sse') || '8');

    if (!leftTileset || !rightTileset) {
      showErr('필수 파라미터 누락 (left_tileset, right_tileset)');
      return;
    }

    document.getElementById('lbl-left').textContent  = '◀ ' + leftLabel;
    document.getElementById('lbl-right').textContent = rightLabel + ' ▶';

    Cesium.Ion.defaultAccessToken = undefined;

    // ──── 두 Viewer 공통 생성 함수 ────
    // role: 'master' = 사용자 조작 (우측), 'slave' = 자동 동기화 (좌측).
    function makeViewer(elId, role) {
      const v = new Cesium.Viewer(elId, {
        baseLayer: false,
        baseLayerPicker: false, geocoder: false, homeButton: false,
        sceneModePicker: false, navigationHelpButton: false,
        animation: false, timeline: false, infoBox: false,
        selectionIndicator: false, fullscreenButton: false,
        // GPU 성능 최우선 + drawing buffer 보존 안 함 (메모리 절약).
        // 두 viewer 동시 운영 시 GPU 압박 ↓ → WebGL context lost 위험 ↓.
        contextOptions: {
          webgl: {
            preserveDrawingBuffer: false,
            powerPreference: 'high-performance',
          },
        },
      });
      v.scene.globe.baseColor = Cesium.Color.fromCssColorString('#2a2a28');
      v.scene.backgroundColor = Cesium.Color.fromCssColorString('#0a0a0a');
      // ⚠ scene.xxx = false (객체 덮어쓰기) 금지 — setDynamicLighting TypeError 회피
      if (v.scene.skyAtmosphere) v.scene.skyAtmosphere.show = false;
      if (v.scene.skyBox)        v.scene.skyBox.show = false;
      if (v.scene.sun)           v.scene.sun.show = false;
      if (v.scene.moon)          v.scene.moon.show = false;
      // 카메라 sync 민감도 — master-slave 단방향이라 ping-pong 위험 없음.
      // 매우 작은 변화도 sync 해야 좌·우 LOD 일치 → 1e-4 (Cesium 권장값).
      v.camera.percentageChanged = 1e-4;

      // ★ slave (좌측) viewer 는 마우스 입력 차단 ★
      // 사용자 결정 (2026-05-25): 우측 = 조작, 좌측 = 자동 동기화.
      // setView 가 moveStart/moveEnd 를 trigger 안 하는 Cesium 한계 우회 +
      // 카메라 ping-pong 원천 차단 + LOD 영구 일치.
      if (role === 'slave') {
        v.scene.screenSpaceCameraController.enableInputs = false;
        v.scene.screenSpaceCameraController.enableRotate = false;
        v.scene.screenSpaceCameraController.enableTranslate = false;
        v.scene.screenSpaceCameraController.enableZoom = false;
        v.scene.screenSpaceCameraController.enableTilt = false;
        v.scene.screenSpaceCameraController.enableLook = false;
      }

      // ★★★ Cesium 공식 권장: requestRenderMode = true ★★★
      // 기본값 false 는 60fps continuous render 모드 — GPU 부담 + 부동소수점
      // 누적 drift + tile streaming 시 미세 카메라 변동을 매 frame 트리거.
      // true 로 설정하면 카메라 변화/엔티티 변화/tile 로드 완료 등 명시적
      // 트리거 시에만 렌더 → GPU 부담 ↓ + 미세 drift 차단 + 두 viewer 가
      // GPU 메모리를 더 안정적으로 공유 (WebGL context lost 위험 ↓).
      v.scene.requestRenderMode = true;
      v.scene.maximumRenderTimeChange = Infinity;

      // ★★★ WebGL context lost/restored 방어 ★★★
      // 두 Cesium viewer 가 같은 GPU 를 공유하면 메모리 압박 시 한쪽 canvas 가
      // context lost → 검은 화면. preventDefault() 로 영구 lost 차단.
      // Cesium 은 내부 restore 로직이 없어 단순 requestRender() 로는 복구 안 됨
      // → location.reload() 로 viewer 전체 재생성 (가장 안전, 22 에이전트 합의).
      const canvas = v.scene.canvas;
      canvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        console.warn('[diff_viewer_3d] webglcontextlost on', elId);
        setStatus(elId.replace('cv-', ''), '⚠ WebGL context lost — 페이지 복원 중');
      }, false);
      canvas.addEventListener('webglcontextrestored', () => {
        console.log('[diff_viewer_3d] webglcontextrestored on', elId, '— reloading');
        // Cesium 내부 GL resource (shader/buffer/texture) 는 lost 시 모두 무효화.
        // requestRender() 로는 복구 불가 — 전체 viewer 재생성이 표준 처리.
        setTimeout(() => location.reload(), 100);
      }, false);

      return v;
    }

    const leftViewer  = makeViewer('cv-left',  'slave');
    const rightViewer = makeViewer('cv-right', 'master');

    // ──── renderError 자가 복구 안전망 (2026-05-25 dead-lock 진단) ────
    // 두 에이전트 합의: Cesium 은 render error 발생 시 스스로
    // `useDefaultRenderLoop = false` 로 세팅 (공식 문서). 그 상태로 두면
    // 좌측 검은 화면 영구 락 → renderError 이벤트에서 자동으로 true 복원.
    //
    // ⚠ 이전 preRender 0-size 가드는 제거됨 — useDefaultRenderLoop 토글이
    //   Cesium 의 내부 에러 핸들링과 timing 충돌해 dead-lock 유발.
    //   `requestRenderMode=true + maximumRenderTimeChange=Infinity` 조합이
    //   이미 적용되어 0-size frame 자체가 거의 안 발생 → framebuffer-incomplete
    //   경고도 자연 소거. ResizeObserver 가드(아래)로 충분.
    function addRenderErrorRecovery(viewer, label) {
      let errCount = 0;
      viewer.scene.renderError.addEventListener((scene, err) => {
        errCount++;
        console.warn('[diff_viewer_3d]', label, 'renderError #' + errCount, err);
        if (errCount > 3) {
          // 무한 에러 루프 차단 — 3회 초과 시 페이지 reload 권유.
          setStatus(label, '⚠ render error 3회 — 새로고침 권장');
          return;
        }
        // 다음 frame 에 자동 복원 — Cesium 이 false 세팅했어도 다시 true.
        requestAnimationFrame(() => {
          viewer.useDefaultRenderLoop = true;
          viewer.scene.requestRender();
        });
      });
    }
    addRenderErrorRecovery(leftViewer,  'left');
    addRenderErrorRecovery(rightViewer, 'right');

    setStatus('left',  '3D Tiles 로드 중…');
    setStatus('right', '3D Tiles 로드 중…');

    // ──── Adaptive SSE 설정 (사용자 use case: 자세히 비교) ────
    // tab34/35 는 "차이점 정밀 비교" 가 핵심 — 정지 시 cm 급 해상도 필요.
    //   · 정지 시 SSE_STATIC = 4 (DJI Terra 측량/검수 권장값, 최고 정밀)
    //   · 이동 시 SSE_MOVING = 32 (응답성, frame stall 차단)
    //   · moveEnd + 1초 후 점진 refine 4 로 복귀
    // query 의 sse 인자는 정지 시 값으로만 사용 (기본 8, tab35 가 4 권장).
    const SSE_STATIC = Math.max(sse, 4);   // 사용자 query 더 낮춰도 4 가 하한
    const SSE_MOVING = 32;

    async function loadTileset(viewer, url, side) {
      try {
        const tileset = await Cesium.Cesium3DTileset.fromUrl(url, {
          maximumScreenSpaceError: SSE_STATIC,
          // ★ LOD 좌·우 완전 일치를 위한 5종 OFF ★
          //  (두 에이전트 합의, 2026-05-25 LOD desync 진단)
          // dynamicSSE: viewer 별 독립 bell-curve 계산 → 부동소수점 차이로
          //   같은 카메라에서도 다른 SSE → tile mismatch.
          dynamicScreenSpaceError: false,
          // skipLOD: 중간 LOD 건너뛰기. 두 viewer 가 다른 중간 LOD 선택 →
          //   영구 divergence (서림 수원지 나무 2 vs 3).
          skipLevelOfDetail: false,
          // foveatedSSE: 중앙/가장자리 SSE 차등. 두 viewer 카메라 미세차로
          //   다른 영역에 다른 SSE 적용.
          foveatedScreenSpaceError: false,
          // progressive prepass: 저해상 → 고해상 단계적 로드. 두 viewer 의
          //   prepass timing 차이 → 잠시 다른 모습.
          progressiveResolutionHeightFraction: 0,
          // cullRequestsWhileMoving: movement 중 request 폐기 → 좌·우 timing
          //   차이로 누락 tile 다름.
          cullRequestsWhileMoving: false,
          // preloadWhenHidden: hidden frame 에서도 streaming 계속.
          //   0-size frame gate 와 결합해 streaming 누락 영구화 차단.
          preloadWhenHidden: true,
          // 메모리 cap — viewer 당 512MB (총 ~1GB). 데스크탑 GPU 4GB+ 안전.
          cacheBytes: 512 * 1024 * 1024,
          maximumCacheOverflowBytes: 128 * 1024 * 1024,
        });
        viewer.scene.primitives.add(tileset);
        await viewer.zoomTo(tileset);
        // tile 로드 완료 추적
        let done = false;
        viewer.scene.postRender.addEventListener(() => {
          const s = tileset.statistics;
          if (!done && s && s.numberOfTilesWithContentReady > 0) {
            done = true;
            setStatus(side, '✅ tiles=' + s.numberOfTilesWithContentReady + '/' + s.numberOfTilesTotal);
          }
        });
        return tileset;
      } catch (e) {
        setStatus(side, '❌ ' + (e.message || e));
        throw e;
      }
    }

    const [leftTs, rightTs] = await Promise.all([
      loadTileset(leftViewer,  leftTileset,  'left'),
      loadTileset(rightViewer, rightTileset, 'right'),
    ]);

    // ════════════════════════════════════════════════════════════════
    //  Master-Slave 패턴 (사용자 결정 2026-05-25)
    //  ─────────────────────────────────────────────────────────────
    //  우측 = master (사용자 조작 + adaptive SSE trigger)
    //  좌측 = slave  (마우스 입력 차단 + master sync 받음)
    //
    //  진단 (두 에이전트 합의):
    //   - setView() 는 dst 에 moveStart/moveEnd/changed 이벤트 미발생
    //     → 양방향 sync 면 dst 의 adaptive SSE 가 영구 락 → LOD divergence
    //   - master-slave 단방향이면: master 의 movement → 양쪽 SSE 동시 변경
    //     → 좌·우 LOD 완전 일치
    // ════════════════════════════════════════════════════════════════

    // ──── 양쪽 동시 wake-up 헬퍼 ────
    // requestRenderMode=true 환경에서 한 쪽만 requestRender 호출하면 다른
    // 쪽 frame 누락 → LOD 결정 frame 어긋남.
    const wakeBoth = () => {
      leftViewer.scene.requestRender();
      rightViewer.scene.requestRender();
    };

    // ──── Adaptive SSE — master(우측) movement → 양쪽 tileset 동시 적용 ────
    //  사용자 use case: tab34/35 는 "차이점 정밀 비교".
    //   · master 이동 시작 → 양쪽 SSE 32 (응답성, frame stall 방지)
    //   · master 이동 끝 + 800ms 정지 → 양쪽 SSE 4 (cm 급 디테일)
    let refineTimer = null;
    rightViewer.camera.moveStart.addEventListener(() => {
      if (refineTimer) { clearTimeout(refineTimer); refineTimer = null; }
      leftTs.maximumScreenSpaceError  = SSE_MOVING;
      rightTs.maximumScreenSpaceError = SSE_MOVING;
      wakeBoth();
    });
    rightViewer.camera.moveEnd.addEventListener(() => {
      if (refineTimer) clearTimeout(refineTimer);
      refineTimer = setTimeout(() => {
        leftTs.maximumScreenSpaceError  = SSE_STATIC;
        rightTs.maximumScreenSpaceError = SSE_STATIC;
        wakeBoth();
        setStatus('left',  '🔒 sync · SSE=' + SSE_STATIC);
        setStatus('right', '🎮 master · SSE=' + SSE_STATIC + ' refine');
      }, 800);
    });

    // ──── 카메라 단방향 sync (우 → 좌) ────
    //  master-slave 라 ping-pong 위험 0 → isSyncing/threshold/rAF 가드 불필요.
    //  master 카메라가 변할 때마다 slave 에 직접 적용 + 양쪽 동시 render.
    //
    //  ⚠⚠⚠ 절대 금지 ⚠⚠⚠
    //   leftViewer.camera.changed.addEventListener(...) 절대 추가하지 말 것!
    //   slave 에 changed 리스너 추가 시 setView 가 slave changed 를 trigger
    //   → 다시 master setView → 무한 ping-pong 루프 → 깜빡거림 재발.
    //   "양방향 sync 가 필요해" 같은 요구가 와도 master-slave 패턴 유지가
    //   유일한 안전 해법 (LOD desync 도 같이 부활). 향후 양방향 필요 시
    //   master 토글 버튼 (좌·우 master 역할 swap) 으로 해결.
    //   배경: [[project-drone-dual-viewer-sync]] + 위 종합 주석 E1 참조.
    rightViewer.camera.changed.addEventListener(() => {
      const src = rightViewer.camera;
      leftViewer.camera.setView({
        destination: src.positionWC.clone(),
        orientation: {
          direction: src.directionWC.clone(),
          up:        src.upWC.clone(),
        },
      });
      wakeBoth();
    });

    // ──── tile-load 동기화 barrier ────
    //  한 쪽이 새 tile 로딩 끝나면 다른 쪽도 강제 render — streaming
    //  도착 timing 차이로 인한 좌·우 visual gap 좁힘.
    leftTs.tileLoad.addEventListener(wakeBoth);
    rightTs.tileLoad.addEventListener(wakeBoth);

    // ──── 공통 초기 카메라 위치 (RTK 기준 정렬) ─────────────────
    // 두 미션 중심의 평균으로 master(우측) 카메라를 이동 → slave(좌측) 자동 추종.
    // RTK Fix 100% 일관 적용 시: 두 중심이 수 cm 이내로 수렴 → 완전 정렬.
    // Single RTK 혼재 시: 수 m 오프셋이 남지만 같은 저수조를 함께 볼 수 있음.
    {
      const commonLat = (leftLat  + rightLat)  / 2;
      const commonLon = (leftLon  + rightLon)  / 2;
      const commonAlt = (leftAlt  + rightAlt)  / 2;
      // 지표 위 200m 에서 60도 내려봄 — 저수조 전체 조감.
      // 필요 시 홈 버튼으로 각 미션 개별 뷰로 되돌릴 수 있음.
      rightViewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(
          commonLon, commonLat, commonAlt + 200
        ),
        orientation: {
          heading: Cesium.Math.toRadians(0),   // 북쪽 기준
          pitch:   Cesium.Math.toRadians(-60), // 60도 하향
          roll:    0,
        },
      });
      // slave(leftViewer)는 camera.changed → setView 이벤트로 자동 추종.
      wakeBoth();
    }

    // ──── 홈 버튼 — 각자 미션의 tileset 으로 ────
    document.getElementById('home-left').onclick  = () => leftViewer.zoomTo(leftTs);
    document.getElementById('home-right').onclick = () => rightViewer.zoomTo(rightTs);

    // ──── window resize 대응 — 0-size 차단 + rAF 묶음 ────
    //  ResizeObserver 가 layout 직후 / paint 직전에 fire.
    //  좌·우 viewer 를 같은 rAF tick 에 묶어 같은 frame 기준으로 resize.
    let pendingResize = false;
    function scheduleResize() {
      if (pendingResize) return;
      pendingResize = true;
      requestAnimationFrame(() => {
        pendingResize = false;
        for (const v of [leftViewer, rightViewer]) {
          const c = v.scene.canvas;
          if (c.clientWidth === 0 || c.clientHeight === 0) continue;
          try { v.resize(); v.scene.requestRender(); } catch (e) {}
        }
      });
    }
    window.addEventListener('resize', scheduleResize);
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(scheduleResize);
      ro.observe(document.getElementById('split'));
    }

    // ──── 페이지 unload 시 viewer destroy (메모리 누수 방지) ────
    window.addEventListener('beforeunload', () => {
      try { leftViewer.destroy();  } catch (e) {}
      try { rightViewer.destroy(); } catch (e) {}
    });

  } catch (e) {
    showErr('초기화 실패: ' + (e && e.message ? e.message : e));
    console.error(e);
  }
})();
</script>
</body>
</html>
